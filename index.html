<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon visuel – Méga Meeting Mbacké</title>
<meta property="og:title" content="Génère ton visuel – Méga Meeting Mbacké">
<meta property="og:description" content="Ajoute ta photo et ton nom, puis télécharge ton visuel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0a1240; --navy2:#14207a; --ink:#070d33; --red:#d4121a; --coral:#ff5a55;
    --sky:#8fd0ff; --card:rgba(255,255,255,.08); --line:rgba(255,255,255,.18); --muted:#c3caf0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--navy)}
  body{
    font-family:'Poppins',system-ui,sans-serif;color:#fff;min-height:100vh;
    background:
      radial-gradient(700px 500px at 85% 0%, rgba(70,92,225,.45), transparent 70%),
      linear-gradient(160deg,#0d1752 0%,#0a1240 55%,#070d33 100%);
    padding:28px 16px 48px;
  }
  .wrap{max-width:1000px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;margin-bottom:26px}
  header .bar{width:8px;align-self:stretch;background:var(--red);border-radius:4px}
  header h1{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.05;text-transform:uppercase;letter-spacing:.5px;text-wrap:balance}
  header p{color:var(--sky);font-weight:500;letter-spacing:2px;font-size:13px;text-transform:uppercase;margin-top:4px}

  .grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:28px;align-items:start}
  @media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}

  .panel{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:20px}
  .step{display:flex;flex-direction:column;gap:10px}
  .step label,.step .lbl{font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px}
  .step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}

  input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  .btn{
    font:inherit;font-weight:600;font-size:16px;border:0;cursor:pointer;border-radius:14px;padding:14px 18px;
    display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;
  }
  .btn.pick{background:rgba(255,255,255,.12);border:1.5px dashed rgba(255,255,255,.5)}
  .btn.pick:hover{background:rgba(255,255,255,.2)}
  .btn.main{background:var(--red);font-size:17px;padding:16px 18px;box-shadow:0 10px 24px rgba(212,18,26,.4)}
  .btn.main:hover{background:#e8222b}
  .btn.alt{background:#fff;color:var(--navy)}
  .btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
  .btn:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

  input[type=text]{
    font:inherit;font-size:17px;font-weight:500;color:var(--navy);background:#fff;border:0;border-radius:14px;padding:14px 16px;width:100%;
  }
  input[type=text]::placeholder{color:#7b83b5}
  .hint{font-size:13px;color:var(--muted);line-height:1.5}

  .adjust{display:flex;flex-direction:column;gap:14px}
  .adjust[hidden]{display:none}
  .row{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
  input[type=range]{width:100%;accent-color:#ff4650;height:28px}

  .preview{display:flex;flex-direction:column;gap:16px;min-width:0}
  .frame{border-radius:18px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.5);border:1.5px solid var(--line);background:#050a2a;line-height:0}
  canvas{display:block;width:100%;height:auto}
  .actions{display:flex;flex-direction:column;gap:10px}
  .tip{font-size:13px;color:var(--muted);text-align:center}
  .privacy{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
  footer{margin-top:30px;text-align:center;font-size:12.5px;color:#8f98cc;letter-spacing:.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bar"></div>
    <div>
      <h1>Génère ton visuel</h1>
      <p>Méga Meeting · Département de Mbacké · 5 décembre 2026</p>
    </div>
  </header>

  <div class="grid">
    <section class="panel" aria-label="Personnalisation">
      <div class="step">
        <span class="lbl"><span class="n">1</span>Ta photo</span>
        <input type="file" id="photo" accept="image/*">
        <button type="button" class="btn pick" id="pickBtn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span id="pickTxt">Choisir une photo</span>
        </button>
      </div>

      <div class="adjust" id="adjust" hidden>
        <div class="row"><label for="zoom">Zoom</label><input type="range" id="zoom" min="1" max="3" step="0.01" value="1"></div>
        <div class="row"><label for="posx">Gauche / droite</label><input type="range" id="posx" min="-1" max="1" step="0.01" value="0"></div>
        <div class="row"><label for="posy">Haut / bas</label><input type="range" id="posy" min="-1" max="1" step="0.01" value="0"></div>
      </div>

      <div class="step">
        <label for="name"><span class="n">2</span>Ton nom</label>
        <input type="text" id="name" maxlength="28" placeholder="Ex : Awa Diop" autocomplete="name">
        <span class="hint">Prénom et nom, ou le nom de ta cellule / ton quartier.</span>
      </div>

      <p class="privacy">Ta photo reste sur ton téléphone : elle n'est envoyée nulle part.</p>
    </section>

    <section class="preview" aria-label="Aperçu">
      <div class="frame"><canvas id="cv" width="1080" height="1080" aria-label="Aperçu de ton visuel"></canvas></div>
      <div class="actions">
        <button type="button" class="btn main" id="dl">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 11l5 5 5-5M5 20h14"/></svg>
          Télécharger mon visuel
        </button>
        <button type="button" class="btn alt" id="share" hidden>Partager directement</button>
        <p class="tip" id="tip">Ajoute ta photo pour activer le téléchargement.</p>
      </div>
    </section>
  </div>

  <footer>KIIRAAY TOUBA · Les Patriotes Républicains</footer>
</div>

    var px = fitText(shown, maxW, 33, '700', 'Poppins, sans-serif');
    ctx.fillStyle = nm ? '#ffffff' : 'rgba(255,255,255,.5)';
    ctx.fillText(shown, tx, py0 + 44);
    ctx.font = '500 17.5px Poppins, sans-serif';
    ctx.fillStyle = '#cfd6ff';
    ctx.fillText('Je serai au Méga Meeting · KIIRAAY TOUBA', tx, py0 + 74);
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath();
  }

  function fileName(){
    var n = elName.value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    return 'mega-meeting-' + (n || 'visuel') + '.png';
  }

  function toBlob(cb){ cv.toBlob(cb, 'image/png'); }

  elDl.addEventListener('click', function(){
    if(!photo) return;
    toBlob(function(blob){
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = fileName();
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      elTip.textContent = "Si rien ne se passe, appuie longuement sur l'image et choisis « Enregistrer l'image ».";
    });
  });

  if(navigator.canShare && navigator.share){
    elShare.hidden = false;
    elShare.addEventListener('click', function(){
      if(!photo) return;
      toBlob(function(blob){
        var file = new File([blob], fileName(), {type:'image/png'});
        if(navigator.canShare({files:[file]})){
          navigator.share({files:[file], text:'Je serai au Méga Meeting de Mbacké le samedi 5 décembre 2026 !'}).catch(function(){});
        } else {
          elTip.textContent = "Le partage direct n'est pas disponible ici. Utilise Télécharger.";
        }
      });
    });
  }

  // redessine quand les polices sont prêtes
  if(document.fonts && document.fonts.load){
    Promise.all([
      document.fonts.load('400 20px Anton'),
      document.fonts.load('700 23px Poppins'),
      document.fonts.load('500 22px Poppins')
    ]).then(draw).catch(function(){});
    document.fonts.ready.then(draw);
  }
  refreshState(); draw();
})();
</script>
</body>
</html>
